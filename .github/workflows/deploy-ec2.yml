name: Deploy Hub Backend to EC2

on:
  push:
    branches:
      - development
      - main
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  APP_ENV: ${{ github.ref == 'refs/heads/development' && 'development' || 'production' }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref == 'refs/heads/development' && 'development' || 'production' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project
        run: npm run build

      - name: Deploy to EC2 - Prepare Environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            DIR_NAME="sms-hub-backend-${{ env.APP_ENV }}"
            mkdir -p /home/${{ secrets.EC2_USERNAME }}/$DIR_NAME
            cd /home/${{ secrets.EC2_USERNAME }}/$DIR_NAME

            # Clean up old build artifacts to prevent ghost files (e.g. old migrations)
            rm -rf dist

            # Create/Update .env file without pipeline secrets
            if [ "${{ env.APP_ENV }}" = "development" ]; then
              echo "NODE_ENV=development" > .env
            else
              echo "NODE_ENV=production" > .env
            fi
            
            echo "AWS_REGION=ap-south-1" >> .env

      - name: Copy files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "dist/,package.json,package-lock.json,ecosystem.config.js"
          target: "/home/${{ secrets.EC2_USERNAME }}/sms-hub-backend-${{ env.APP_ENV }}"

      - name: Install Prod Dependencies and Restart PM2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # Explicitly load Node/NVM in this non-interactive shell
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            export PATH=$PATH:/usr/local/bin

            DIR_NAME="sms-hub-backend-${{ env.APP_ENV }}"
            cd /home/${{ secrets.EC2_USERNAME }}/$DIR_NAME
            
            # Install only production dependencies
            npm ci --omit=dev
            
            # Run compiled JS database migrations
            npm run migration:prod
            
            # Restart or start PM2 with the dynamic name
            export PM2_NAME=$DIR_NAME
            pm2 start ecosystem.config.js --only $DIR_NAME --update-env || pm2 restart $DIR_NAME --update-env
            pm2 save
